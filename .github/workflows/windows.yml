name: Windows build

# Windows apps can only be built on Windows, so CI does it: every push that
# touches the app, or on demand from the Actions tab. The run's
# "expert-edu-center-windows-setup" artifact is the installer staff use;
# "expert-edu-center-windows" is the bare app folder (the .exe needs the
# DLLs and data/ beside it). tools/publish-desktop.sh puts the installer on
# the server for the app's self-update.
on:
  push:
    branches: [master]
    paths:
      - "lib/**"
      - "assets/**"
      - "windows/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release

      # Silent printing for the Telegram print station (Settings -> Printer): SumatraPDF's portable
      # exe, checked against a pinned hash, sits beside the app in tools\ and goes into the installer.
      # (GPLv3, unmodified, run as a separate program; source: github.com/sumatrapdfreader/sumatrapdf)
      - name: Bundle SumatraPDF
        shell: pwsh
        run: |
          $version = "3.6.1"
          $zip = Join-Path $env:RUNNER_TEMP "sumatra.zip"
          Invoke-WebRequest "https://www.sumatrapdfreader.org/dl/rel/$version/SumatraPDF-$version-64.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "98b33a518d42986856d225064b0cd2d3643ecf78cbf84ab873d26cc51877a544") { throw "SumatraPDF hash mismatch: $hash" }
          $unzipped = Join-Path $env:RUNNER_TEMP "sumatra"
          Expand-Archive $zip -DestinationPath $unzipped
          $tools = "build\windows\x64\runner\Release\tools"
          New-Item -ItemType Directory -Force $tools | Out-Null
          Copy-Item (Join-Path $unzipped "SumatraPDF-$version-64.exe") (Join-Path $tools "SumatraPDF.exe")
          "SumatraPDF $version (GPLv3), unmodified, used to print. Source: https://github.com/sumatrapdfreader/sumatrapdf" | Set-Content (Join-Path $tools "SumatraPDF-README.txt")

      # The installer (windows/installer/expert_edu_center.iss) -- what
      # staff install, and what the app downloads to update itself.
      - name: Build installer
        shell: pwsh
        run: |
          $line = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value
          $version, $build = $line.Split('+')
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=$version /DBuildNumber=$build windows\installer\expert_edu_center.iss

      - uses: actions/upload-artifact@v4
        with:
          name: expert-edu-center-windows-setup
          path: build/windows/installer/*.exe
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: expert-edu-center-windows
          path: build/windows/x64/runner/Release/
          retention-days: 30
