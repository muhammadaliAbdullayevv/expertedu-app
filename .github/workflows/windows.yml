name: Windows build

# Windows apps can only be built on Windows, so CI does it: every push that
# touches the app, or on demand from the Actions tab. The run's
# "expert-edu-center-windows-setup" artifact is the installer staff use;
# "expert-edu-center-windows" is the bare app folder (the .exe needs the
# DLLs and data/ beside it). tools/publish-desktop.sh puts the installer on
# the server for the app's self-update.
on:
  push:
    branches: [master]
    paths:
      - "lib/**"
      - "assets/**"
      - "windows/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release

      # The installer (windows/installer/expert_edu_center.iss) -- what
      # staff install, and what the app downloads to update itself.
      - name: Build installer
        shell: pwsh
        run: |
          $line = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value
          $version, $build = $line.Split('+')
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=$version /DBuildNumber=$build windows\installer\expert_edu_center.iss

      - uses: actions/upload-artifact@v4
        with:
          name: expert-edu-center-windows-setup
          path: build/windows/installer/*.exe
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: expert-edu-center-windows
          path: build/windows/x64/runner/Release/
          retention-days: 30
